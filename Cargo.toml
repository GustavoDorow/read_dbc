[workspace]
members = ["crates/core", "crates/format", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
duckdb-neo = { version = "=0.20001.0", features = ["build-extension"] }
read_dbc_core = { path = "crates/core" }
read_dbc_format = { path = "crates/format" }

[profile.release]
lto = true
strip = true
