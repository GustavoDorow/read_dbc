[package]
name = "read_dbc_format"
description = "Streaming, dependency-free reader for DATASUS .dbc files (PKWare DCL + dBase III)"
version.workspace = true
edition.workspace = true
license = "MIT"

# No runtime dependencies: CRC-32, the DCL decoder and the code pages are
# implemented here.
[dependencies]

[features]
# Test tooling only: a minimal DBF/DBC writer (`read_dbc_format::writer`)
# used to generate the committed fixtures in test/fixtures/. Never needed
# to read files.
writer = []

[[example]]
name = "make_fixtures"
required-features = ["writer"]

[dev-dependencies]
datasus-core = "=0.1.0"
flate2 = "1"
serde_json = "1"
